  # vm-test:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: cachix/install-nix-action@v27
  #     - run: nix build --print-build-logs '.#checks.x86_64-linux.vm-boot'
